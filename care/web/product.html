<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Band 39 · Margaret, Lisa and a day in 30 seconds</title>
<link rel="stylesheet" href="fonts/fonts.css" />
<script src="js/icons.js"></script>
<style>
  /* Band 39 product page: the elderly portal, the caregiver portal and the 30-second simulator, live and linked.
     Three copies of the app share one household code; the simulator drives the pretend band (it is the hub)
     and the two portals follow it every ~1.5 s through /api/state, exactly like two real phones would. */
  :root { --paper: #F5EEE5; --card: #FFFDFA; --ink: #2E241E; --ink2: #5C4C42; --muted: #745F51; --line: #E9DED1; --terra: #B0532F; --terra-d: #8E3F20; --bezel: #2A221D; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: radial-gradient(1200px 520px at 85% -10%, #FBE3D2 0%, transparent 60%), var(--paper); color: var(--ink); font: 15px/1.45 Figtree, ui-sans-serif, system-ui, sans-serif; min-height: 100vh; }
  header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; max-width: 1560px; margin: 0 auto; padding: 18px 24px 10px; }
  h1 { margin: 0; font: 600 30px/1 Fraunces, Georgia, serif; letter-spacing: -.02em; }
  header p { margin: 0; color: var(--ink2); }
  .tabs { margin-left: auto; display: none; gap: 4px; padding: 3px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); }
  .tabs button { height: 34px; padding: 0 14px; border: 0; border-radius: 999px; background: none; color: var(--ink2); font: 600 14px Figtree, system-ui, sans-serif; cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--ink); color: var(--paper); }
  main { display: grid; grid-template-columns: 392px 392px minmax(520px, 1fr); gap: 20px; max-width: 1560px; margin: 0 auto; padding: 8px 24px 32px; align-items: start; }
  .panel { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .panel h2 { display: flex; align-items: center; gap: 9px; margin: 0; font: 700 13px/1 Figtree, system-ui, sans-serif; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
  .panel h2 span { width: 24px; height: 24px; border-radius: 8px; display: grid; place-items: center; background: #F8E3D8; color: var(--terra-d); font-size: 13px; letter-spacing: 0; }
  .panel h2 a { margin-left: auto; color: var(--terra-d); font-size: 12px; letter-spacing: 0; text-transform: none; text-decoration: none; font-weight: 700; }
  .panel h2 a:hover { text-decoration: underline; }
  .phone { position: relative; width: 392px; height: 812px; border: 10px solid var(--bezel); border-radius: 48px; background: var(--bezel); box-shadow: 0 24px 50px -24px rgba(60,35,20,.55); overflow: hidden; }
  .phone::before { content: ''; position: absolute; top: 8px; left: 50%; width: 96px; height: 26px; transform: translateX(-50%); background: var(--bezel); border-radius: 999px; z-index: 2; pointer-events: none; }
  .phone iframe { width: 100%; height: 100%; border: 0; border-radius: 38px; background: #EAF2FF; display: block; }
  .screen { height: 812px; border: 1px solid var(--line); border-radius: 26px; overflow: hidden; background: var(--card); box-shadow: 0 24px 50px -28px rgba(60,35,20,.45); }
  .screen iframe { width: 100%; height: 100%; border: 0; display: block; }
  footer { max-width: 1560px; margin: 0 auto; padding: 0 24px 28px; color: var(--muted); font-size: 13px; }
  @media (max-width: 1360px) { main { grid-template-columns: 392px 392px; } .panel.sim { grid-column: 1 / -1; order: -1; } .screen { height: 760px; } }
  @media (max-width: 860px) {
    header { padding: 14px 14px 8px; } h1 { font-size: 24px; } header p { display: none; } .tabs { display: flex; }
    main { grid-template-columns: 1fr; padding: 6px 14px 24px; } .panel { display: none; } .panel.on { display: flex; } .panel.sim { order: 0; }
    .phone { width: 100%; max-width: 392px; height: 760px; margin: 0 auto; } .screen { height: 78vh; min-height: 560px; }
  }
  /* the event, large: Margaret → Bracelet → Lisa's portal, fed by the simulator (postMessage 'b39-event') */
  .panel.sim { grid-column: 3; grid-row: 1 / span 2; align-self: stretch; } .panel.elder { grid-column: 1; grid-row: 1; } .panel.carer { grid-column: 2; grid-row: 1; } .panel.sim .screen { flex: 1; height: auto; min-height: 812px; }
  .flowp { grid-column: 1 / 3; grid-row: 2; background: var(--card); border: 1px solid var(--line); border-radius: 26px; padding: 18px 20px; box-shadow: 0 24px 50px -30px rgba(60,35,20,.45); }
  .flowp-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .flowp-head h2 { margin: 0; font: 600 22px Fraunces, Georgia, serif; } .flowp-head time { margin-left: auto; color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
  .tag { height: 26px; padding: 0 11px; border-radius: 999px; display: inline-flex; align-items: center; font-size: 12.5px; font-weight: 700; background: #EFE6DA; color: var(--ink2); }
  .tag.mental { background: #EFEAFE; color: #6A4BD8; } .tag.financial { background: #FBEFD9; color: #8F5B12; } .tag.physical { background: #DDF3E8; color: #23704C; }
  .lanes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 30px; }
  .lane { position: relative; display: flex; flex-direction: column; gap: 8px; padding: 16px; border-radius: 18px; background: #FBF7F1; min-height: 190px; }
  .lane:not(:last-child)::after { content: '→'; position: absolute; right: -24px; top: 50%; transform: translateY(-50%); color: var(--terra); font-weight: 800; font-size: 20px; }
  .lane h3 { display: flex; align-items: center; gap: 7px; margin: 0; font: 700 12px/1 Figtree, system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .lane .big { font: 600 20px/1.2 Fraunces, Georgia, serif; display: flex; align-items: center; gap: 8px; }
  .lane q { color: var(--ink2); font-style: italic; } .lane small { color: var(--ink2); font-size: 14px; }
  .chip { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 11px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-size: 13px; font-weight: 700; color: var(--ink2); }
  .led { width: 12px; height: 12px; border-radius: 50%; background: var(--led); box-shadow: 0 0 10px var(--led); flex: none; }
  .note { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; } .note b { display: flex; align-items: center; gap: 7px; } .note p { margin: 4px 0 0; font-size: 13.5px; color: var(--ink2); }
  .appic { width: 20px; height: 20px; border-radius: 6px; display: grid; place-items: center; background: #23704C; color: #fff; flex: none; }
  .where { font-size: 13px; font-weight: 700; color: var(--terra-d); }
  .lane.lisa.urgent { background: #FBE4DC; } .lane.lisa.urgent .note { border-color: #E9B7A4; } .lane.lisa.urgent .note b { color: var(--terra-d); }
  .route { list-style: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 6px; margin: 16px 0 0; padding: 12px 14px; border-radius: 16px; border: 1px dashed #DCCDBD; background: #FBF7F1; }
  .route li { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-size: 13.5px; font-weight: 600; color: var(--ink2); animation: hop 2.6s ease-in-out infinite; animation-delay: calc(var(--k) * .4s); }
  .route li:not(:last-child)::after { content: '→'; margin: 0 -4px 0 8px; color: var(--terra); font-weight: 800; }
  .route li:last-child { background: var(--terra); border-color: var(--terra); color: #fff; }
  @keyframes hop { 0%, 100% { box-shadow: none; } 15% { box-shadow: 0 0 0 4px rgba(176,83,47,.22); border-color: var(--terra); } }
  .flowp .idle { color: var(--muted); margin: 0; }
  @media (max-width: 1360px) { .panel.sim { grid-column: 1 / -1; grid-row: 1; } .panel.elder, .panel.carer { grid-row: 2; } .panel.carer { grid-column: 2; } .flowp { grid-row: 3; } .panel.sim .screen { min-height: 0; height: 760px; flex: none; } .flowp { grid-column: 1 / -1; } }
  @media (max-width: 860px) { .panel, .flowp { grid-column: 1 !important; grid-row: auto !important; } .flowp { display: none; } .flowp.on { display: block; } .lanes { grid-template-columns: 1fr; gap: 26px; } .lane:not(:last-child)::after { right: 50%; top: auto; bottom: -24px; transform: translateX(50%) rotate(90deg); } }
  @media (prefers-reduced-motion: reduce) { .route li { animation: none; } }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
  :focus-visible { outline: 3px solid var(--terra); outline-offset: 2px; }
</style>
</head>
<body>
<header>
  <h1>Band 39</h1>
  <p>One day, three screens. Press play in the simulator.</p>
  <div class="tabs" role="tablist" aria-label="Screens">
    <button role="tab" data-show="elder" aria-selected="false">Margaret</button>
    <button role="tab" data-show="carer" aria-selected="false">Lisa</button>
    <button role="tab" data-show="sim" aria-selected="true">Simulator</button>
  </div>
</header>
<main>
  <section class="panel elder" id="elder" aria-labelledby="h-elder">
    <h2 id="h-elder"><span>1</span>Elderly portal<a href="/#/grandma/g-today" target="_blank" rel="noopener">Open</a></h2>
    <div class="phone"><iframe title="Margaret's portal" data-src="#/grandma/g-today" data-phone="1" loading="eager"></iframe></div>
  </section>
  <section class="panel carer" id="carer" aria-labelledby="h-carer">
    <h2 id="h-carer"><span>2</span>Caregiver portal<a href="/#/caregiver/c-home" target="_blank" rel="noopener">Open</a></h2>
    <div class="phone"><iframe title="Lisa's caregiver portal" data-src="#/caregiver/c-home" data-phone="1" loading="eager"></iframe></div>
  </section>
  <section class="panel sim on" id="sim" aria-labelledby="h-sim">
    <h2 id="h-sim"><span>3</span>Simulator<a href="/" target="_blank" rel="noopener">Open</a></h2>
    <div class="screen"><iframe title="Simulator: a day in 30 seconds" data-src="#/" loading="eager"></iframe></div>
  </section>
  <section class="flowp" id="flowp" aria-live="polite" aria-label="What happens, step by step">
    <div class="flowp-head"><span class="tag" id="fTag">Ready</span><h2 id="fName">Press play or tap an event</h2><time id="fTime"></time></div>
    <div class="lanes" id="fLanes"></div>
    <ol class="route" id="fRoute" aria-label="Information flow"></ol>
  </section>
</main>
<footer>Signals, not diagnoses. Past days are sample history. The card is simulated.</footer>
<script>
  // one household code for all three screens (the app reads ?home=), so the portals follow the simulator's band
  (function () {
    const ok = (c) => /^[A-Z0-9]{6}$/.test(c || '');
    let home = (new URL(location.href).searchParams.get('home') || '').toUpperCase();
    if (!ok(home)) home = (localStorage.getItem('b39home') || '').toUpperCase();
    if (!ok(home)) { home = Array.from(crypto.getRandomValues(new Uint8Array(6)), (b) => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[b % 32]).join(''); }
    localStorage.setItem('b39home', home);
    document.querySelectorAll('iframe[data-src]').forEach((f) => { f.src = `index.html?embed=1${f.dataset.phone ? '&phone=1' : '&product=1'}&home=${home}${f.dataset.src === '#/' && new URL(location.href).searchParams.get('autoplay') ? '&autoplay=1' : ''}${f.dataset.src}`; });
    // the event, large, under the phones
    const I = (n, z = 16) => (window.VexoIcons ? VexoIcons.svg(n, z) : '');
    const esc = (t) => String(t == null ? '' : t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const lane = (cls, ic, h, body) => `<div class="lane ${cls}"><h3>${I(ic)}${h}</h3>${body}</div>`;
    function paint(e) {
      document.getElementById('fTag').className = 'tag ' + e.cat; document.getElementById('fTag').textContent = e.catName;
      document.getElementById('fName').textContent = e.name; document.getElementById('fTime').textContent = e.t;
      document.getElementById('fLanes').innerHTML =
        lane('', 'user', 'Margaret', `<span class="big">${esc(e.does)}</span>${e.say ? `<q>${esc(e.say)}</q>` : ''}`) +
        lane('', 'watch', 'Bracelet', `<span class="chip">${I(e.sensorIcon, 14)}${esc(e.sensor)}</span><span class="big">${e.led ? `<i class="led" style="--led:${e.led}"></i>` : ''}${esc(e.reading)}</span><small>${esc(e.bandDoes)}</small>`) +
        lane('lisa ' + (e.lisa.level === 'urgent' ? 'urgent' : ''), 'phone', 'Lisa’s portal', `<div class="note"><b><span class="appic">${I('sprout', 12)}</span>${esc(e.lisa.title)}</b><p>${esc(e.lisa.body)}</p></div><span class="where">${esc(e.where)}</span>`);
      document.getElementById('fRoute').innerHTML = (e.flow || []).map(([ic, l], k) => `<li style="--k:${k}">${I(ic, 15)}${esc(l)}</li>`).join('');
    }
    addEventListener('message', (m) => { if (m.origin === location.origin && m.data && m.data.type === 'b39-event') paint(m.data); });
    // phones: one screen at a time
    const tabs = document.querySelectorAll('[data-show]');
    tabs.forEach((b) => b.addEventListener('click', () => {
      tabs.forEach((x) => x.setAttribute('aria-selected', String(x === b)));
      document.querySelectorAll('.panel').forEach((p) => p.classList.toggle('on', p.id === b.dataset.show));
      document.getElementById('flowp').classList.toggle('on', b.dataset.show === 'sim');
    }));
  })();
</script>
</body>
</html>
